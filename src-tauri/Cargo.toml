[package]
name = "nook"
version = "0.1.3"
edition = "2021"
description = "A Windows app for Claude Code"
license = "MIT"
repository = "https://github.com/Skyway1111/nook"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"

[profile.release]
lto = "thin"
strip = true
